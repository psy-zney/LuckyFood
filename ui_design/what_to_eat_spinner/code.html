</div>

<!-- Pointer Arrow -->
<div class="absolute -top-6 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center drop-shadow-md">
<div class="w-4 h-4 rounded-full bg-error-container border-2 border-surface-main"></div>
<div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[16px] border-t-error-container -mt-1"></div>
</div>
