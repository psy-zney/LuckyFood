<body class="antialiased flex flex-col h-[884px] overflow-hidden text-on-surface selection:bg-primary-container" style="background-color: #FCFCFA; min-height: 100dvh;">

</button>
</header>

<!-- Interactive Element -->
<button aria-label="Roll the dice" class="group flex flex-col items-center justify-center opacity-90 active:scale-[0.98] transition-all duration-500 ease-out focus:outline-none space-y-6">

</button>
</main>

<span class="material-symbols-outlined mb-1 group-hover:animate-pulse" data-icon="auto_awesome">auto_awesome</span>
<span class="font-serif text-[11px] uppercase tracking-widest">Discover</span>
</button>
<button aria-label="Randomize" class="flex flex-col items-center justify-center text-[#5A4D4D] font-bold scale-100 active:scale-90 transition-all duration-300 hover:text-[#F4D0D0] group">
<span class="material-symbols-outlined mb-1" data-icon="casino" data-weight="fill" style="font-variation-settings: 'FILL' 1;">casino</span>
<span class="font-serif text-[11px] uppercase tracking-widest text-[#F4D0D0]">Randomize</span>
</button>
