<style>
        .ghost-input:focus {
            border-bottom-color: #725758; /* on-primary-container */
            outline: none;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-[#FCFCFA] text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden antialiased">
<!-- Subtle Background Illustration Area -->
<div class="absolute top-0 left-0 w-full h-[353px] z-0 overflow-hidden pointer-events-none opacity-40">
<div class="absolute -top-20 -left-20 w-96 h-96 bg-primary-container rounded-full blur-3xl mix-blend-multiply"></div>
<div class="absolute top-10 -right-20 w-[400px] h-[400px] bg-secondary-container rounded-full blur-3xl mix-blend-multiply opacity-70"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-container-margin z-10 flex flex-col relative">
<!-- Header Section -->
<header class="text-center mb-xl mt-lg">
<h1 class="font-display-md text-display-md text-on-surface mb-sm tracking-tight italic">Welcome to Savor</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Elevate your everyday cooking.</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-lg w-full">
<!-- Input Group: Email -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="ghost-input w-full bg-transparent border-0 border-b border-surface-variant text-on-surface font-body-md text-body-md pl-10 py-xs placeholder:text-outline-variant transition-colors" placeholder="Email Address" type="email"/>
</div>
<!-- Input Group: Password -->
<div class="relative group mb-md">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="ghost-input w-full bg-transparent border-0 border-b border-surface-variant text-on-surface font-body-md text-body-md pl-10 py-xs placeholder:text-outline-variant transition-colors" placeholder="Password" type="password"/>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md items-center mt-sm">
<!-- Primary Button -->
<button class="w-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg py-sm px-gutter rounded-full hover:bg-tertiary-container transition-colors duration-300" type="button">
                    Login
                </button>
<!-- Secondary Link -->
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors py-xs px-sm inline-block" href="#">
                    Continue as Guest
                </a>
</div>
</form>
<!-- Minimalist Footer/Divider -->
<div class="mt-xl flex flex-col items-center">
<div class="w-12 h-[1px] bg-outline-variant mb-md"></div>
<p class="font-label-sm text-label-sm text-outline">Create an account</p>
</div>
</main>
</body></html>
